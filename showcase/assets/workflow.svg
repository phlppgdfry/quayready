<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300"><title>Evidence to reviewed dispatch request</title><rect width="1100" height="300" fill="#f4f7f9"/><g font-family="sans-serif" fill="#183b53"><text x="32" y="48" font-size="24" font-weight="700">Evidence → review → reliable transfer</text><g fill="#fff" stroke="#a8becb"><rect x="30" y="95" width="240" height="130" rx="8"/><rect x="300" y="95" width="240" height="130" rx="8"/><rect x="570" y="95" width="240" height="130" rx="8"/><rect x="840" y="95" width="230" height="130" rx="8"/></g><g font-size="19" font-weight="700"><text x="50" y="135">Reconcile</text><text x="320" y="135">Review</text><text x="590" y="135">Persist</text><text x="860" y="135">Deliver / recover</text></g><g font-size="14" fill="#496171"><text x="50" y="167">2/3 → explain missing P003</text><text x="50" y="193">Correct complete source snapshot</text><text x="320" y="167">Current evidence version</text><text x="320" y="193">Different stable subject</text><text x="590" y="167">Approval + outbox together</text><text x="590" y="193">Immutable ID and payload</text><text x="860" y="167">Independent HTTP target</text><text x="860" y="193">Lookup uncertain outcomes</text><text x="32" y="270">Synthetic logistics process. Requesting dispatch review is not authorising physical departure.</text></g></g></svg>
