<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560"><title>Lost-response recovery sequence</title><rect width="1000" height="560" fill="#fff"/><g font-family="sans-serif" fill="#183b53"><text x="40" y="45" font-size="24" font-weight="700">Committed does not always mean received.</text><g font-size="16" text-anchor="middle"><text x="150" y="100">Worker</text><text x="500" y="100">App database</text><text x="850" y="100">Mock-TMS + target DB</text></g><g stroke="#ccd8df"><path d="M150 115V510M500 115V510M850 115V510"/></g><g stroke="#183b53" stroke-width="2"><path d="M150 155H500M500 205H150M150 260H850M850 325H150M150 395H850M850 465H150"/></g><g font-size="15"><text x="180" y="145">Reserve POST / COMMIT</text><text x="180" y="195">Durable lease + stable ID</text><text x="300" y="250">HTTP POST / target commits one effect</text><text x="300" y="315" fill="#85520b">Response lost — outcome unknown</text><text x="300" y="385">Restart → GET original dispatch ID</text><text x="300" y="455" fill="#23624e">Matching receipt → fenced confirmation</text><text x="40" y="540">Protocol diagram, not a recording. Repeated target delivery has one effect under the simulated contract.</text></g></g></svg>
