<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">QuayReady system boundaries</title><desc id="desc">Synthetic sources and independent reviewers use FastAPI. The application database owns evidence and outbox. A worker sends HTTP to an independent mock-TMS and target database.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9" fill="#496171"/></marker></defs><rect width="1200" height="620" fill="#fff"/><g font-family="sans-serif" fill="#172e40"><text x="42" y="50" font-size="22" font-weight="700">A real boundary, deliberately small.</text><text x="42" y="78" font-size="14" fill="#496171">One Python codebase. Independently persisted source review and target receipt.</text><rect x="290" y="110" width="490" height="450" rx="12" fill="#f4f7f9" stroke="#ccd8df"/><text x="315" y="145" font-size="13">Application ownership</text><g fill="#fff" stroke="#a8becb"><rect x="42" y="185" width="200" height="110" rx="8"/><rect x="42" y="365" width="200" height="110" rx="8"/><rect x="325" y="185" width="190" height="110" rx="8"/><rect x="560" y="185" width="185" height="110" rx="8"/><rect x="325" y="355" width="190" height="135" rx="8"/><rect x="560" y="365" width="185" height="110" rx="8"/><rect x="855" y="185" width="300" height="110" rx="8"/><rect x="855" y="365" width="300" height="110" rx="8"/></g><g font-size="18" font-weight="700"><text x="60" y="218">Synthetic sources</text><text x="60" y="400">People</text><text x="345" y="220">FastAPI</text><text x="580" y="220">Domain rules</text><text x="345" y="390">App SQLite</text><text x="580" y="400">Worker</text><text x="880" y="220">Independent mock-TMS</text><text x="880" y="400">Target SQLite</text></g><g font-size="13" fill="#496171"><text x="60" y="245">Order / warehouse / documents</text><text x="60" y="268">Identity + source revision</text><text x="60" y="425">Operator / independent reviewer</text><text x="60" y="449">Session + CSRF</text><text x="345" y="246">Strict ingestion + workbench</text><text x="345" y="268">Version-bound review</text><text x="580" y="246">Pure readiness + reasons</text><text x="580" y="268">Explicit clock boundaries</text><text x="345" y="416">Receipts / current snapshots</text><text x="345" y="438">Decision + outbox, atomically</text><text x="345" y="460">Immutable payload + audit</text><text x="580" y="426">Reserve / HTTP / fenced result</text><text x="580" y="448">Lookup-first recovery</text><text x="880" y="246">Authenticated POST / GET</text><text x="880" y="268">Stable dispatch ID + hash</text><text x="880" y="426">Unique target effect</text><text x="880" y="448">Durable receipt + lookup</text><text x="855" y="533">Target ownership — separate process + DB</text><text x="42" y="594">No shared integration table. No network call inside an app transaction. No physical departure authorisation.</text></g></g><g stroke="#496171" stroke-width="2" marker-end="url(#a)" fill="none"><path d="M242 240H320"/><path d="M242 420H278V280H320"/><path d="M515 240H555"/><path d="M420 295V350"/><path d="M515 420H555"/><path d="M745 420H815V240H850"/><path d="M1005 295V360"/></g><text x="790" y="333" font-family="sans-serif" font-size="13" fill="#183b53">HTTP</text></svg>
