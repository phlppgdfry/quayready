[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quayready"
version = "0.2.0rc1"
readme = "README.md"
license = "MIT"
description = "Independent synthetic cross-dock integration and readiness lab"
requires-python = ">=3.13,<3.14"
dependencies = ["fastapi==0.162.0", "uvicorn==0.54.0", "jsonschema==4.26.0", "jinja2==3.1.6", "httpx==0.28.1"]

[project.scripts]
quayready = "quayready.cli:main"

[tool.setuptools.package-data]
quayready = ["contracts/*", "templates/*", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["acceptance: domain, database and API acceptance", "integration: real local HTTP/process boundary", "contract: OpenAPI request/response checks", "browser: real rendered workbench"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
