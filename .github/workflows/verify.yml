name: Verify release candidate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, verified upstream
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.18'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install exact development dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install -e . --no-deps --no-build-isolation
          npm ci --ignore-scripts
          python -m playwright install --with-deps chromium
      - name: Verify application, contracts, security, browser, accessibility and static build
        run: python scripts/verify.py
      - name: Check dependency advisories
        run: |
          python -m pip_audit --format json --output evidence/rc/dependency-audit.json
          npm audit --audit-level=low
      - name: Retain actual execution evidence (never run credentials)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quayready-local-equivalent-checks
          path: |
            evidence/rc/checks/
            evidence/rc/execution.json
            evidence/rc/pytest.xml
            evidence/rc/accessibility/
            evidence/rc/dependency-audit.json
          retention-days: 14
      - name: Retain static preview only; no deployment
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quayready-static-preview
          path: .runs/site/quayready/
          include-hidden-files: true # Preserve the allowlisted .nojekyll marker, not run credentials.
          retention-days: 14
